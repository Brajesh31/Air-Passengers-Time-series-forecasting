name: Feature request
description: Suggest a forecasting or project improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How should this be validated?
      description: Explain the chronological split, baselines, metrics, or other evidence needed.
    validations:
      required: true
