name: Forecasting Project Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate notebooks and forecasting workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate notebook structure and syntax
        run: python scripts/validate_notebook.py

      - name: Run repository and forecasting tests
        run: python -m pytest

      - name: Run forecasting smoke test
        run: python scripts/forecast.py --horizon 6 --test-months 24
